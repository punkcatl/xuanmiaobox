<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 252" width="660" height="252" role="img" aria-label="四吉神能破格，四凶神能成格">
<title>四吉神能破格，四凶神能成格</title>
<style>
.xf-t{font-family:"Noto Serif SC","Songti SC",serif;fill:var(--ink,#2b2620)}
.xf-s{font-family:"Noto Sans SC","PingFang SC",sans-serif;fill:var(--ink-3,#7a7064)}
.xf-g{fill:var(--gold,#a07d3c)}
.xf-ln{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1.2}
.xf-dash{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1;stroke-dasharray:4 4}
.xf-box{fill:none;stroke:var(--ink-4,#c9bfae);stroke-width:1}
.xf-hl{fill:var(--gold,#a07d3c);fill-opacity:.12}
</style>
<defs><marker id="xf-19-jixiong-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--ink-3,#9a8f80)"/></marker></defs>
<text x="170" y="32" class="xf-t" font-size="15" text-anchor="middle" >四吉神 · 用之不当能破格</text><text x="490" y="32" class="xf-g" font-size="15" text-anchor="middle" >四凶神 · 施之得宜能成格</text><text x="170" y="54" class="xf-s" font-size="11" text-anchor="middle" >（第十八章）</text><text x="490" y="54" class="xf-s" font-size="11" text-anchor="middle" >（第十九章）</text><rect x="20" y="62" width="300" height="144" rx="4" class="xf-box"/><text x="54" y="86" class="xf-t" font-size="17" text-anchor="middle" >财</text><text x="86" y="85" class="xf-s" font-size="12.5" text-anchor="start" >食神带煞，透财为害</text><text x="54" y="120" class="xf-t" font-size="17" text-anchor="middle" >官</text><text x="86" y="119" class="xf-s" font-size="12.5" text-anchor="start" >春木火旺，见官则忌</text><text x="54" y="154" class="xf-t" font-size="17" text-anchor="middle" >印</text><text x="86" y="153" class="xf-s" font-size="12.5" text-anchor="start" >煞逢食制，透印无功</text><text x="54" y="188" class="xf-t" font-size="17" text-anchor="middle" >食</text><text x="86" y="187" class="xf-s" font-size="12.5" text-anchor="start" >财旺生官，露食则杂</text><rect x="340" y="62" width="300" height="144" rx="4" fill="var(--gold,#a07d3c)" fill-opacity=".08" stroke="var(--gold,#a07d3c)"/><text x="374" y="86" class="xf-g" font-size="17" text-anchor="middle" >煞</text><text x="406" y="85" class="xf-s" font-size="12.5" text-anchor="start" >印绶根轻，透煞为助</text><text x="374" y="120" class="xf-g" font-size="17" text-anchor="middle" >伤</text><text x="406" y="119" class="xf-s" font-size="12.5" text-anchor="start" >财逢比劫，伤官可解</text><text x="374" y="154" class="xf-g" font-size="17" text-anchor="middle" >枭</text><text x="406" y="153" class="xf-s" font-size="12.5" text-anchor="start" >食神带煞，灵枭得用</text><text x="374" y="188" class="xf-g" font-size="17" text-anchor="middle" >刃</text><text x="406" y="187" class="xf-s" font-size="12.5" text-anchor="start" >财逢七煞，刃可解厄</text><text x="330" y="244" class="xf-s" font-size="11.5" text-anchor="middle" >好坏不在神本身，而在用得当与否：如治国之长枪大戟，施之得宜可以戡乱</text>
</svg>
