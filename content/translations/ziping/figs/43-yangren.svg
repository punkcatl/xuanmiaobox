<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 286" width="520" height="286" role="img" aria-label="五阳干的禄与阳刃：甲禄寅刃卯，丙戊禄巳刃午，庚禄申刃酉，壬禄亥刃子">
<title>五阳干的禄与阳刃：甲禄寅刃卯，丙戊禄巳刃午，庚禄申刃酉，壬禄亥刃子</title>
<style>
.xf-t{font-family:"Noto Serif SC","Songti SC",serif;fill:var(--ink,#2b2620)}
.xf-s{font-family:"Noto Sans SC","PingFang SC",sans-serif;fill:var(--ink-3,#7a7064)}
.xf-g{fill:var(--gold,#a07d3c)}
.xf-ln{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1.2}
.xf-dash{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1;stroke-dasharray:4 4}
.xf-box{fill:none;stroke:var(--ink-4,#c9bfae);stroke-width:1}
.xf-hl{fill:var(--gold,#a07d3c);fill-opacity:.12}
</style>
<defs><marker id="xf-43-yangren-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--ink-3,#9a8f80)"/></marker></defs>
<text x="100" y="40" class="xf-s" font-size="12" text-anchor="middle" >阳干</text><text x="250" y="40" class="xf-s" font-size="12" text-anchor="middle" >禄</text><text x="400" y="40" class="xf-s" font-size="12" text-anchor="middle" >阳刃（禄前一位）</text><line x1="40" y1="52" x2="480" y2="52" class="xf-box"/><text x="100" y="76" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">甲</text><text x="250" y="76" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">寅</text><line x1="272" y1="70" x2="368" y2="70" class="xf-ln" marker-end="url(#xf-43-yangren-arrow)"/><rect x="381" y="54" width="38" height="30" rx="3" fill="none" stroke="var(--fire,#b5533f)" stroke-width="1.2"/><text x="400" y="76" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">卯</text><text x="100" y="112" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">丙</text><text x="250" y="112" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">巳</text><line x1="272" y1="106" x2="368" y2="106" class="xf-ln" marker-end="url(#xf-43-yangren-arrow)"/><rect x="381" y="90" width="38" height="30" rx="3" fill="none" stroke="var(--fire,#b5533f)" stroke-width="1.2"/><text x="400" y="112" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">午</text><text x="100" y="148" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">戊</text><text x="250" y="148" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">巳</text><line x1="272" y1="142" x2="368" y2="142" class="xf-ln" marker-end="url(#xf-43-yangren-arrow)"/><rect x="381" y="126" width="38" height="30" rx="3" fill="none" stroke="var(--fire,#b5533f)" stroke-width="1.2"/><text x="400" y="148" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">午</text><text x="100" y="184" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--metal,#8a8478)">庚</text><text x="250" y="184" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--metal,#8a8478)">申</text><line x1="272" y1="178" x2="368" y2="178" class="xf-ln" marker-end="url(#xf-43-yangren-arrow)"/><rect x="381" y="162" width="38" height="30" rx="3" fill="none" stroke="var(--fire,#b5533f)" stroke-width="1.2"/><text x="400" y="184" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--metal,#8a8478)">酉</text><text x="100" y="220" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">壬</text><text x="250" y="220" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">亥</text><line x1="272" y1="214" x2="368" y2="214" class="xf-ln" marker-end="url(#xf-43-yangren-arrow)"/><rect x="381" y="198" width="38" height="30" rx="3" fill="none" stroke="var(--fire,#b5533f)" stroke-width="1.2"/><text x="400" y="220" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">子</text><text x="260" y="278" class="xf-s" font-size="11" text-anchor="middle" >阳刃劫我正财，是正财的七煞；劫之甚者，故不曰劫而曰刃（惟五阳干有之）</text>
</svg>
