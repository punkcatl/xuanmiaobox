<text x="161" y="26" class="xf-t" font-size="14" text-anchor="middle" >薛相公命</text><text x="66" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >年柱</text><text x="66" y="72" class="xf-s" font-size="11" text-anchor="middle" >劫财</text><text x="66" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">甲</text><text x="66" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--metal,#8a8478)">申</text><text x="66" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >庚·正官</text><text x="140" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >月柱</text><text x="140" y="72" class="xf-s" font-size="11" text-anchor="middle" >正印</text><text x="140" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">壬</text><text x="140" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--metal,#8a8478)">申</text><text x="140" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >庚·正官</text><rect x="121" y="80" width="38" height="32" rx="3" fill="none" stroke="var(--gold,#a07d3c)" stroke-width="1.6"/><text x="162" y="92" font-size="11" class="xf-g">印</text><rect x="121" y="120" width="38" height="32" rx="3" fill="none" stroke="var(--gold,#a07d3c)" stroke-width="1.6"/><text x="162" y="132" font-size="11" class="xf-g">官</text><text x="214" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >日柱</text><text x="214" y="72" class="xf-g" font-size="11" text-anchor="middle" >日元</text><text x="214" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">乙</text><text x="214" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">巳</text><text x="214" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >丙·伤官</text><text x="288" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >时柱</text><text x="288" y="72" class="xf-s" font-size="11" text-anchor="middle" >正财</text><text x="288" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">戊</text><text x="288" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">寅</text><text x="288" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >甲·劫财</text><rect x="269" y="80" width="38" height="32" rx="3" fill="none" stroke="var(--gold,#a07d3c)" stroke-width="1.6"/><text x="310" y="92" font-size="11" class="xf-g">财</text><text x="161" y="196" class="xf-s" font-size="11.5" text-anchor="middle" >月令申中庚金为正官；壬印、戊财</text><text x="161" y="214" class="xf-s" font-size="11.5" text-anchor="middle" >中隔乙日，水土不相碍，故为大贵</text><text x="517" y="26" class="xf-t" font-size="14" text-anchor="middle" >李参政命</text><text x="422" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >年柱</text><text x="422" y="72" class="xf-s" font-size="11" text-anchor="middle" >七煞</text><text x="422" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--metal,#8a8478)">庚</text><text x="422" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">寅</text><text x="422" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >甲·比肩</text><rect x="403" y="80" width="38" height="32" rx="3" fill="none" stroke="var(--gold,#a07d3c)" stroke-width="1.6"/><text x="444" y="92" font-size="11" class="xf-g">煞</text><text x="496" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >月柱</text><text x="496" y="72" class="xf-s" font-size="11" text-anchor="middle" >劫财</text><text x="496" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">乙</text><text x="496" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--metal,#8a8478)">酉</text><text x="496" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >辛·正官</text><rect x="477" y="80" width="38" height="32" rx="3" fill="none" stroke="var(--gold,#a07d3c)" stroke-width="1.6"/><text x="518" y="92" font-size="11" class="xf-g">合</text><rect x="477" y="120" width="38" height="32" rx="3" fill="none" stroke="var(--gold,#a07d3c)" stroke-width="1.6"/><text x="518" y="132" font-size="11" class="xf-g">官</text><text x="570" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >日柱</text><text x="570" y="72" class="xf-g" font-size="11" text-anchor="middle" >日元</text><text x="570" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">甲</text><text x="570" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">子</text><text x="570" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >癸·正印</text><text x="644" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >时柱</text><text x="644" y="72" class="xf-s" font-size="11" text-anchor="middle" >偏财</text><text x="644" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">戊</text><text x="644" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">辰</text><text x="644" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >戊·偏财</text><text x="517" y="196" class="xf-s" font-size="11.5" text-anchor="middle" >甲用酉官，年透庚煞混杂；</text><text x="517" y="214" class="xf-s" font-size="11.5" text-anchor="middle" >乙庚相合，合煞留官，杂而取清</text>
