<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 294" width="600" height="294" role="img" aria-label="五种一方专旺格：曲直仁寿、炎上、稼穑、从革、润下">
<title>五种一方专旺格：曲直仁寿、炎上、稼穑、从革、润下</title>
<style>
.xf-t{font-family:"Noto Serif SC","Songti SC",serif;fill:var(--ink,#2b2620)}
.xf-s{font-family:"Noto Sans SC","PingFang SC",sans-serif;fill:var(--ink-3,#7a7064)}
.xf-g{fill:var(--gold,#a07d3c)}
.xf-ln{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1.2}
.xf-dash{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1;stroke-dasharray:4 4}
.xf-box{fill:none;stroke:var(--ink-4,#c9bfae);stroke-width:1}
.xf-hl{fill:var(--gold,#a07d3c);fill-opacity:.12}
</style>
<defs><marker id="xf-48-zhuanwang-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--ink-3,#9a8f80)"/></marker></defs>
<text x="90" y="40" class="xf-s" font-size="12" text-anchor="middle" >格名</text><text x="220" y="40" class="xf-s" font-size="12" text-anchor="middle" >日主</text><text x="390" y="40" class="xf-s" font-size="12" text-anchor="middle" >地支全局</text><text x="530" y="40" class="xf-s" font-size="12" text-anchor="middle" >偏旺</text><line x1="30" y1="52" x2="570" y2="52" class="xf-box"/><text x="90" y="74" class="xf-t" font-size="15" text-anchor="middle" >曲直仁寿</text><text x="220" y="74" font-size="17" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">甲乙</text><text x="390" y="74" class="xf-t" font-size="14" text-anchor="middle" >亥卯未 或 寅卯辰</text><circle cx="530" cy="68" r="15" fill="var(--wood,#5f7d55)" fill-opacity=".14" stroke="var(--wood,#5f7d55)" stroke-width="1.4"/><text x="530" y="73.0" font-size="14" text-anchor="middle" font-family="Noto Serif SC,serif" font-weight="600" style="fill:var(--wood,#5f7d55)">木</text><text x="90" y="112" class="xf-t" font-size="15" text-anchor="middle" >炎上</text><text x="220" y="112" font-size="17" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">丙丁</text><text x="390" y="112" class="xf-t" font-size="14" text-anchor="middle" >寅午戌 或 巳午未</text><circle cx="530" cy="106" r="15" fill="var(--fire,#b5533f)" fill-opacity=".14" stroke="var(--fire,#b5533f)" stroke-width="1.4"/><text x="530" y="111.0" font-size="14" text-anchor="middle" font-family="Noto Serif SC,serif" font-weight="600" style="fill:var(--fire,#b5533f)">火</text><text x="90" y="150" class="xf-t" font-size="15" text-anchor="middle" >稼穑</text><text x="220" y="150" font-size="17" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">戊己</text><text x="390" y="150" class="xf-t" font-size="14" text-anchor="middle" >辰戌丑未</text><circle cx="530" cy="144" r="15" fill="var(--earth,#9a7b45)" fill-opacity=".14" stroke="var(--earth,#9a7b45)" stroke-width="1.4"/><text x="530" y="149.0" font-size="14" text-anchor="middle" font-family="Noto Serif SC,serif" font-weight="600" style="fill:var(--earth,#9a7b45)">土</text><text x="90" y="188" class="xf-t" font-size="15" text-anchor="middle" >从革</text><text x="220" y="188" font-size="17" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--metal,#8a8478)">庚辛</text><text x="390" y="188" class="xf-t" font-size="14" text-anchor="middle" >巳酉丑 或 申酉戌</text><circle cx="530" cy="182" r="15" fill="var(--metal,#8a8478)" fill-opacity=".14" stroke="var(--metal,#8a8478)" stroke-width="1.4"/><text x="530" y="187.0" font-size="14" text-anchor="middle" font-family="Noto Serif SC,serif" font-weight="600" style="fill:var(--metal,#8a8478)">金</text><text x="90" y="226" class="xf-t" font-size="15" text-anchor="middle" >润下</text><text x="220" y="226" font-size="17" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">壬癸</text><text x="390" y="226" class="xf-t" font-size="14" text-anchor="middle" >申子辰 或 亥子丑</text><circle cx="530" cy="220" r="15" fill="var(--water,#4f6d85)" fill-opacity=".14" stroke="var(--water,#4f6d85)" stroke-width="1.4"/><text x="530" y="225.0" font-size="14" text-anchor="middle" font-family="Noto Serif SC,serif" font-weight="600" style="fill:var(--water,#4f6d85)">水</text><text x="300" y="286" class="xf-s" font-size="11.5" text-anchor="middle" >气势偏于一方，取运大都顺其旺势；逆其势（如官煞克之）为忌</text>
</svg>
