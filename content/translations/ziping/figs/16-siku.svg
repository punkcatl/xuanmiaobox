<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 252" width="560" height="252" role="img" aria-label="四墓库（辰戌丑未）的藏干：本气、余气与库中所藏">
<title>四墓库（辰戌丑未）的藏干：本气、余气与库中所藏</title>
<style>
.xf-t{font-family:"Noto Serif SC","Songti SC",serif;fill:var(--ink,#2b2620)}
.xf-s{font-family:"Noto Sans SC","PingFang SC",sans-serif;fill:var(--ink-3,#7a7064)}
.xf-g{fill:var(--gold,#a07d3c)}
.xf-ln{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1.2}
.xf-dash{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1;stroke-dasharray:4 4}
.xf-box{fill:none;stroke:var(--ink-4,#c9bfae);stroke-width:1}
.xf-hl{fill:var(--gold,#a07d3c);fill-opacity:.12}
</style>
<defs><marker id="xf-16-siku-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--ink-3,#9a8f80)"/></marker></defs>
<text x="80" y="40" class="xf-s" font-size="12" text-anchor="middle" >墓库</text><text x="200" y="40" class="xf-s" font-size="12" text-anchor="middle" >本气（土）</text><text x="320" y="40" class="xf-s" font-size="12" text-anchor="middle" >余气</text><text x="440" y="40" class="xf-s" font-size="12" text-anchor="middle" >库中所藏</text><line x1="30" y1="52" x2="530" y2="52" class="xf-box"/><text x="80" y="70" font-size="20" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">辰</text><text x="200" y="70" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">戊</text><text x="320" y="70" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">乙</text><text x="440" y="70" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">癸</text><text x="476" y="69" class="xf-s" font-size="11" text-anchor="start" >水库</text><text x="80" y="108" font-size="20" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">戌</text><text x="200" y="108" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">戊</text><text x="320" y="108" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--metal,#8a8478)">辛</text><text x="440" y="108" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">丁</text><text x="476" y="107" class="xf-s" font-size="11" text-anchor="start" >火库</text><text x="80" y="146" font-size="20" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">丑</text><text x="200" y="146" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">己</text><text x="320" y="146" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">癸</text><text x="440" y="146" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--metal,#8a8478)">辛</text><text x="476" y="145" class="xf-s" font-size="11" text-anchor="start" >金库</text><text x="80" y="184" font-size="20" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">未</text><text x="200" y="184" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">己</text><text x="320" y="184" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">丁</text><text x="440" y="184" font-size="19" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">乙</text><text x="476" y="183" class="xf-s" font-size="11" text-anchor="start" >木库</text><text x="280" y="244" class="xf-s" font-size="11.5" text-anchor="middle" >所藏者多、用神不一，故称“杂气”；取透干、会支之清者为用</text>
</svg>
