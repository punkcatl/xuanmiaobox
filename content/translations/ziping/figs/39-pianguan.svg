none" stroke="var(--gold,#a07d3c)" stroke-width="1.6"/><text x="518" y="92" font-size="11" class="xf-g">印</text><text x="570" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >日柱</text><text x="570" y="72" class="xf-g" font-size="11" text-anchor="middle" >日元</text><text x="570" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">丙</text><text x="570" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">戌</text><text x="570" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >戊·食神</text><text x="644" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >时柱</text><text x="644" y="72" class="xf-s" font-size="11" text-anchor="middle" >食神</text><text x="644" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">戊</text><text x="644" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">戌</text><text x="644" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >戊·食神</text><rect x="625" y="80" width="38" height="32" rx="3" fill="none" stroke="var(--gold,#a07d3c)" stroke-width="1.6"/><text x="666" y="92" font-size="11" class="xf-g">食</text><text x="517" y="196" class="xf-s" font-size="11.5" text-anchor="middle" >辰中暗煞，壬水透出；戊土食神太重，</text><text x="517" y="214" class="xf-s" font-size="11.5" text-anchor="middle" >透甲木印以损其太过，印先食后</text>
