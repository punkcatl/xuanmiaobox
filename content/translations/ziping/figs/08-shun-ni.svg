<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 226" width="640" height="226" role="img" aria-label="用神的顺用与逆用：财官印食顺用，煞伤刃劫逆用">
<title>用神的顺用与逆用：财官印食顺用，煞伤刃劫逆用</title>
<style>
.xf-t{font-family:"Noto Serif SC","Songti SC",serif;fill:var(--ink,#2b2620)}
.xf-s{font-family:"Noto Sans SC","PingFang SC",sans-serif;fill:var(--ink-3,#7a7064)}
.xf-g{fill:var(--gold,#a07d3c)}
.xf-ln{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1.2}
.xf-dash{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1;stroke-dasharray:4 4}
.xf-box{fill:none;stroke:var(--ink-4,#c9bfae);stroke-width:1}
.xf-hl{fill:var(--gold,#a07d3c);fill-opacity:.12}
</style>
<defs><marker id="xf-08-shun-ni-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--ink-3,#9a8f80)"/></marker></defs>
<text x="160" y="30" class="xf-g" font-size="16" text-anchor="middle" >善神 · 顺用</text><text x="480" y="30" class="xf-g" font-size="16" text-anchor="middle" >不善之神 · 逆用</text><text x="160" y="52" class="xf-s" font-size="11" text-anchor="middle" >顺其性而生之、护之</text><text x="480" y="52" class="xf-s" font-size="11" text-anchor="middle" >逆其性而制之、化之</text><rect x="20" y="54" width="280" height="128" rx="4" class="xf-box"/><text x="54" y="76" class="xf-t" font-size="15" text-anchor="middle" >财</text><text x="150" y="76" class="xf-s" font-size="12" text-anchor="middle" >喜食神相生</text><text x="245" y="76" class="xf-s" font-size="12" text-anchor="middle" >喜生官以护财</text><text x="54" y="106" class="xf-t" font-size="15" text-anchor="middle" >官</text><text x="150" y="106" class="xf-s" font-size="12" text-anchor="middle" >喜透财相生</text><text x="245" y="106" class="xf-s" font-size="12" text-anchor="middle" >喜生印以护官</text><text x="54" y="136" class="xf-t" font-size="15" text-anchor="middle" >印</text><text x="150" y="136" class="xf-s" font-size="12" text-anchor="middle" >喜官煞相生</text><text x="245" y="136" class="xf-s" font-size="12" text-anchor="middle" >喜劫财以护印</text><text x="54" y="166" class="xf-t" font-size="15" text-anchor="middle" >食</text><text x="150" y="166" class="xf-s" font-size="12" text-anchor="middle" >喜身旺相生</text><text x="245" y="166" class="xf-s" font-size="12" text-anchor="middle" >喜生财以护食</text><rect x="340" y="54" width="280" height="128" rx="4" class="xf-box"/><text x="374" y="76" class="xf-t" font-size="15" text-anchor="middle" >七煞</text><text x="470" y="76" class="xf-s" font-size="12" text-anchor="middle" >喜食神制伏</text><text x="565" y="76" class="xf-s" font-size="12" text-anchor="middle" >忌财印资扶</text><text x="374" y="106" class="xf-t" font-size="15" text-anchor="middle" >伤官</text><text x="470" y="106" class="xf-s" font-size="12" text-anchor="middle" >喜佩印制伏</text><text x="565" y="106" class="xf-s" font-size="12" text-anchor="middle" >喜生财化伤</text><text x="374" y="136" class="xf-t" font-size="15" text-anchor="middle" >阳刃</text><text x="470" y="136" class="xf-s" font-size="12" text-anchor="middle" >喜官煞制伏</text><text x="565" y="136" class="xf-s" font-size="12" text-anchor="middle" >忌官煞俱无</text><text x="374" y="166" class="xf-t" font-size="15" text-anchor="middle" >月劫</text><text x="470" y="166" class="xf-s" font-size="12" text-anchor="middle" >喜透官制伏</text><text x="565" y="166" class="xf-s" font-size="12" text-anchor="middle" >宜用财透食化劫</text><text x="320" y="218" class="xf-s" font-size="12" text-anchor="middle" >当顺而顺、当逆而逆，配合得宜，皆为贵格</text>
</svg>
