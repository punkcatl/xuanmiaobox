<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" role="img" aria-label="天干如官长，地支如辖地：甲禄在寅，乙禄在卯">
<title>天干如官长，地支如辖地：甲禄在寅，乙禄在卯</title>
<style>
.xf-t{font-family:"Noto Serif SC","Songti SC",serif;fill:var(--ink,#2b2620)}
.xf-s{font-family:"Noto Sans SC","PingFang SC",sans-serif;fill:var(--ink-3,#7a7064)}
.xf-g{fill:var(--gold,#a07d3c)}
.xf-ln{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1.2}
.xf-dash{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1;stroke-dasharray:4 4}
.xf-box{fill:none;stroke:var(--ink-4,#c9bfae);stroke-width:1}
.xf-hl{fill:var(--gold,#a07d3c);fill-opacity:.12}
</style>
<defs><marker id="xf-01-ganzhi-guanchang-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--ink-3,#9a8f80)"/></marker></defs>
<rect x="20" y="20" width="560" height="80" rx="4" class="xf-box"/><rect x="20" y="150" width="560" height="80" rx="4" class="xf-box"/><text x="36" y="55" class="xf-g" font-size="18" text-anchor="start" >天</text><text x="36" y="80" class="xf-s" font-size="12" text-anchor="start" >天干 · 流动不居 · 如官长</text><text x="36" y="185" class="xf-g" font-size="18" text-anchor="start" >地</text><text x="36" y="210" class="xf-s" font-size="12" text-anchor="start" >地支 · 固定不迁 · 如辖地</text><text x="330" y="66" class="xf-t" font-size="26" text-anchor="middle" >甲</text><text x="330" y="88" class="xf-s" font-size="11" text-anchor="middle" >阳 · 木之气</text><line x1="330" y1="104" x2="330" y2="146" class="xf-ln" marker-end="url(#xf-01-ganzhi-guanchang-arrow)"/><text x="342" y="130" class="xf-g" font-size="13" text-anchor="start" >禄</text><text x="330" y="196" class="xf-t" font-size="26" text-anchor="middle" >寅</text><text x="330" y="218" class="xf-s" font-size="11" text-anchor="middle" >阳 · 正月</text><text x="470" y="66" class="xf-t" font-size="26" text-anchor="middle" >乙</text><text x="470" y="88" class="xf-s" font-size="11" text-anchor="middle" >阴 · 木之质</text><line x1="470" y1="104" x2="470" y2="146" class="xf-ln" marker-end="url(#xf-01-ganzhi-guanchang-arrow)"/><text x="482" y="130" class="xf-g" font-size="13" text-anchor="start" >禄</text><text x="470" y="196" class="xf-t" font-size="26" text-anchor="middle" >卯</text><text x="470" y="218" class="xf-s" font-size="11" text-anchor="middle" >阴 · 二月</text><text x="36" y="130" class="xf-s" font-size="11" text-anchor="start" >如知府坐镇府城、知县坐镇县城，各司一月之令</text>
</svg>
