<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" width="820" height="350" role="img" aria-label="八格成败一览：各格成格与败格的条件">
<title>八格成败一览：各格成格与败格的条件</title>
<style>
.xf-t{font-family:"Noto Serif SC","Songti SC",serif;fill:var(--ink,#2b2620)}
.xf-s{font-family:"Noto Sans SC","PingFang SC",sans-serif;fill:var(--ink-3,#7a7064)}
.xf-g{fill:var(--gold,#a07d3c)}
.xf-ln{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1.2}
.xf-dash{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1;stroke-dasharray:4 4}
.xf-box{fill:none;stroke:var(--ink-4,#c9bfae);stroke-width:1}
.xf-hl{fill:var(--gold,#a07d3c);fill-opacity:.12}
</style>
<defs><marker id="xf-09-chengbai-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--ink-3,#9a8f80)"/></marker></defs>
<text x="70" y="36" class="xf-s" font-size="13" text-anchor="middle" >格局</text><text x="320" y="36" class="xf-g" font-size="15" text-anchor="middle" >成</text><text x="660" y="36" class="xf-s" font-size="15" text-anchor="middle" >败</text><line x1="20" y1="46" x2="800" y2="46" class="xf-box"/><rect x="20" y="42" width="780" height="32" class="xf-hl"/><text x="70" y="64" class="xf-t" font-size="14" text-anchor="middle" >正官</text><text x="130" y="64" class="xf-t" font-size="11.5" text-anchor="start" >官逢财、印，又无刑冲破害</text><text x="520" y="64" class="xf-s" font-size="11.5" text-anchor="start" >官逢伤官克、刑冲</text><text x="70" y="98" class="xf-t" font-size="14" text-anchor="middle" >财</text><text x="130" y="98" class="xf-t" font-size="11.5" text-anchor="start" >财生官旺；财逢食生而身强带比；财格透印而位置妥帖</text><text x="520" y="98" class="xf-s" font-size="11.5" text-anchor="start" >财轻比重；财透七煞</text><rect x="20" y="110" width="780" height="32" class="xf-hl"/><text x="70" y="132" class="xf-t" font-size="14" text-anchor="middle" >印</text><text x="130" y="132" class="xf-t" font-size="11.5" text-anchor="start" >印轻逢煞；官印双全；身印两旺用食伤泄秀；印多逢财而财透根轻</text><text x="520" y="132" class="xf-s" font-size="11.5" text-anchor="start" >印轻逢财；身强印重而透煞</text><text x="70" y="166" class="xf-t" font-size="14" text-anchor="middle" >食神</text><text x="130" y="166" class="xf-t" font-size="11.5" text-anchor="start" >食神生财；食带煞而无财，弃食就煞而透印</text><text x="520" y="166" class="xf-s" font-size="11.5" text-anchor="start" >食神逢枭；生财而露煞</text><rect x="20" y="178" width="780" height="32" class="xf-hl"/><text x="70" y="200" class="xf-t" font-size="14" text-anchor="middle" >七煞</text><text x="130" y="200" class="xf-t" font-size="11.5" text-anchor="start" >身强七煞逢制</text><text x="520" y="200" class="xf-s" font-size="11.5" text-anchor="start" >七煞逢财而无制</text><text x="70" y="234" class="xf-t" font-size="14" text-anchor="middle" >伤官</text><text x="130" y="234" class="xf-t" font-size="11.5" text-anchor="start" >伤官生财；伤官佩印、伤旺印有根；伤旺身弱而透煞印；伤官带煞而无财</text><text x="520" y="234" class="xf-s" font-size="11.5" text-anchor="start" >非金水伤官而见官；生财带煞；佩印而伤轻身旺</text><rect x="20" y="246" width="780" height="32" class="xf-hl"/><text x="70" y="268" class="xf-t" font-size="14" text-anchor="middle" >阳刃</text><text x="130" y="268" class="xf-t" font-size="11.5" text-anchor="start" >透官煞而露财印，不见伤官</text><text x="520" y="268" class="xf-s" font-size="11.5" text-anchor="start" >无官煞</text><text x="70" y="302" class="xf-t" font-size="14" text-anchor="middle" >建禄月劫</text><text x="130" y="302" class="xf-t" font-size="11.5" text-anchor="start" >透官逢财印；透财逢食伤；透煞遇制伏</text><text x="520" y="302" class="xf-s" font-size="11.5" text-anchor="start" >无财官，透煞印</text>
</svg>
