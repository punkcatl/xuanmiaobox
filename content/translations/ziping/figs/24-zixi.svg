<text x="357" y="28" class="xf-s" font-size="12" text-anchor="middle" >甲乙日主以庚金为子星（阳干长生顺行）：时支落在庚的何宫，子息多寡已有定数</text><line x1="60" y1="210" x2="694" y2="210" class="xf-box"/><rect x="82" y="114" width="28" height="96" fill="var(--gold,#a07d3c)" fill-opacity=".22" stroke="var(--gold,#a07d3c)" stroke-width="1"/><text x="96" y="106" class="xf-g" font-size="11" text-anchor="middle" >四子</text><text x="96" y="232" class="xf-s" font-size="11" text-anchor="middle" >长生</text><text x="96" y="256" font-size="16" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">巳</text><rect x="134" y="162" width="28" height="48" fill="var(--gold,#a07d3c)" fill-opacity=".22" stroke="var(--gold,#a07d3c)" stroke-width="1"/><text x="148" y="154" class="xf-g" font-size="11" text-anchor="middle" >一双</text><text x="148" y="232" class="xf-s" font-size="11" text-anchor="middle" >沐浴</text><text x="148" y="256" font-size="16" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">午</text><rect x="186" y="138" width="28" height="72" fill="var(--gold,#a07d3c)" fill-opacity=".22" stroke="var(--gold,#a07d3c)" stroke-width="1"/><text x="200" y="130" class="xf-g" font-size="11" text-anchor="middle" >三子</text><text x="200" y="232" class="xf-s" font-size="11" text-anchor="middle" >冠带</text><text x="200" y="256" font-size="16" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">未</text><rect x="238" y="138" width="28" height="72" fill="var(--gold,#a07d3c)" fill-opacity=".22" stroke="var(--gold,#a07d3c)" stroke-width="1"/><text x="252" y="130" class="xf-g" font-size="11" text-anchor="middle" >三子</text><text x="252" y="232" class="xf-s" font-size="11" text-anchor="middle" >临官</text><text x="252" y="256" font-size="16" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--metal,#8a8478)">申</text><rect x="290" y="90" width="28" height="120" fill="var(--gold,#a07d3c)" fill-opacity=".22" stroke="var(--gold,#a07d3c)" stroke-width="1"/><text x="304" y="82" class="xf-g" font-size="11" text-anchor="middle" >五子</text><text x="304" y="232" class="xf-s" font-size="11" text-anchor="middle" >帝旺</text><text x="304" y="256" font-size="16" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--metal,#8a8478)">酉</text><rect x="342" y="162" width="28" height="48" fill="var(--gold,#a07d3c)" fill-opacity=".22" stroke="var(--gold,#a07d3c)" stroke-width="1"/><text x="356" y="154" class="xf-g" font-size="11" text-anchor="middle" >二子</text><text x="356" y="232" class="xf-s" font-size="11" text-anchor="middle" >衰</text><text x="356" y="256" font-size="16" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">戌</text><rect x="394" y="186" width="28" height="24" fill="var(--gold,#a07d3c)" fill-opacity=".22" stroke="var(--gold,#a07d3c)" stroke-width="1"/><text x="408" y="178" class="xf-g" font-size="11" text-anchor="middle" >一子</text><text x="408" y="232" class="xf-s" font-size="11" text-anchor="middle" >病</text><text x="408" y="256" font-size="16" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">亥</text><text x="460" y="202" class="xf-s" font-size="11" text-anchor="middle" >无子</text><text x="460" y="232" class="xf-s" font-size="11" text-anchor="middle" >死</text><text x="460" y="256" font-size="16" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">子</text><text x="512" y="202" class="xf-s" font-size="11" text-anchor="middle" >（主夭）</text><text x="512" y="232" class="xf-s" font-size="11" text-anchor="middle" >墓</text><text x="512" y="256" font-size="16" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">丑</text><rect x="550" y="186" width="28" height="24" fill="var(--gold,#a07d3c)" fill-opacity=".22" stroke="var(--gold,#a07d3c)" stroke-width="1"/><text x="564" y="178" class="xf-g" font-size="11" text-anchor="middle" >一子</text><text x="564" y="232" class="xf-s" font-size="11" text-anchor="middle" >绝</text><text x="564" y="256" font-size="16" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">寅</text><rect x="602" y="186" width="28" height="24" fill="var(--gold,#a07d3c)" fill-opacity=".22" stroke="var(--gold,#a07d3c)" stroke-width="1"/><text x="616" y="178" class="xf-g" font-size="11" text-anchor="middle" >头胎女</text><text x="616" y="232" class="xf-s" font-size="11" text-anchor="middle" >胎</text><text x="616" y="256" font-size="16" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">卯</text><rect x="654" y="186" width="28" height="24" fill="var(--gold,#a07d3c)" fill-opacity=".22" stroke="var(--gold,#a07d3c)" stroke-width="1"/><text x="668" y="178" class="xf-g" font-size="11" text-anchor="middle" >三留一</text><text x="668" y="232" class="xf-s" font-size="11" text-anchor="middle" >养</text><text x="668" y="256" font-size="16" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">辰</text><text x="36" y="232" class="xf-s" font-size="10" text-anchor="middle" >十二宫</text><text x="36" y="256" class="xf-s" font-size="10" text-anchor="middle" >时支</text><text x="357" y="282" class="xf-s" font-size="11" text-anchor="middle" >歌诀所言为大略；更须看时干子星是否有用，有用则虽逢死绝亦主子贵</text>
</svg>
