<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 714 290" width="714" height="290" role="img" aria-label="子息长生歌：以甲乙日为例，时支落在庚金十二宫的子息之数">
<title>子息长生歌：以甲乙日为例，时支落在庚金十二宫的子息之数</title>
<style>
