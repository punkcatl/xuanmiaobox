<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="四象与五行：一气分阴阳，阴阳分老少成四象，五行具于其中">
<title>四象与五行：一气分阴阳，阴阳分老少成四象，五行具于其中</title>
<style>
