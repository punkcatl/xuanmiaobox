<text x="161" y="26" class="xf-t" font-size="14" text-anchor="middle" >梁丞相命</text><text x="66" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >年柱</text><text x="66" y="72" class="xf-s" font-size="11" text-anchor="middle" >偏财</text><text x="66" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">丁</text><text x="66" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">未</text><text x="66" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >己·七煞</text><rect x="47" y="80" width="38" height="32" rx="3" fill="none" stroke="var(--gold,#a07d3c)" stroke-width="1.6"/><text x="88" y="92" font-size="11" class="xf-g">财</text><text x="140" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >月柱</text><text x="140" y="72" class="xf-s" font-size="11" text-anchor="middle" >比肩</text><text x="140" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">癸</text><text x="140" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">卯</text><text x="140" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >乙·食神</text><rect x="121" y="120" width="38" height="32" rx="3" fill="none" stroke="var(--gold,#a07d3c)" stroke-width="1.6"/><text x="162" y="132" font-size="11" class="xf-g">食</text><text x="214" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >日柱</text><text x="214" y="72" class="xf-g" font-size="11" text-anchor="middle" >日元</text><text x="214" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">癸</text><text x="214" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">亥</text><text x="214" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >壬·劫财</text><text x="288" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >时柱</text><text x="288" y="72" class="xf-s" font-size="11" text-anchor="middle" >比肩</text><text x="288" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">癸</text><text x="288" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">丑</text><text x="288" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >己·七煞</text><text x="161" y="196" class="xf-s" font-size="11.5" text-anchor="middle" >卯中乙木为食神，身强食旺；</text><text x="161" y="214" class="xf-s" font-size="11.5" text-anchor="middle" >年透丁火为财，食神生财，大贵</text><text x="517" y="26" class="xf-t" font-size="14" text-anchor="middle" >常国公命</text><text x="422" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >年柱</text><text x="422" y="72" class="xf-s" font-size="11" text-anchor="middle" >偏印</text><text x="422" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--metal,#8a8478)">辛</text><text x="422" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">卯</text><text x="422" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >乙·食神</text><text x="496" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >月柱</text><text x="496" y="72" class="xf-s" font-size="11" text-anchor="middle" >偏印</text><text x="496" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--metal,#8a8478)">辛</text><text x="496" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">卯</text><text x="496" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >乙·食神</text><rect x="477" y="80" width="38" height="32" rx="3" fill="none" stroke="var(--gold,#a07d3c)" stroke-width="1.6"/><text x="518" y="92" font-size="11" class="xf-g">印</text><rect x="477" y="120" width="38" height="32" rx="3" fill="none" stroke="var(--gold,#a07d3c)" stroke-width="1.6"/><text x="518" y="132" font-size="11" class="xf-g">食</text><text x="570" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >日柱</text><text x="570" y="72" class="xf-g" font-size="11" text-anchor="middle" >日元</text><text x="570" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">癸</text><text x="570" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--metal,#8a8478)">酉</text><text x="570" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >辛·偏印</text><text x="644" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >时柱</text><text x="644" y="72" class="xf-s" font-size="11" text-anchor="middle" >七煞</text><text x="644" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">己</text><text x="644" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">未</text><text x="644" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >己·七煞</text><rect x="625" y="80" width="38" height="32" rx="3" fill="none" stroke="var(--gold,#a07d3c)" stroke-width="1.6"/><text x="666" y="92" font-size="11" class="xf-g">煞</text><text x="517" y="196" class="xf-s" font-size="11.5" text-anchor="middle" >食神不用财而就煞、印：</text><text x="517" y="214" class="xf-s" font-size="11.5" text-anchor="middle" >己土七煞，辛金印化之，威权显赫</text>
</svg>
