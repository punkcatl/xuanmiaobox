<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 170" width="700" height="170" role="img" aria-label="十干建禄表：甲禄寅、乙禄卯、丙戊禄巳、丁己禄午、庚禄申、辛禄酉、壬禄亥、癸禄子">
<title>十干建禄表：甲禄寅、乙禄卯、丙戊禄巳、丁己禄午、庚禄申、辛禄酉、壬禄亥、癸禄子</title>
<style>
.xf-t{font-family:"Noto Serif SC","Songti SC",serif;fill:var(--ink,#2b2620)}
.xf-s{font-family:"Noto Sans SC","PingFang SC",sans-serif;fill:var(--ink-3,#7a7064)}
.xf-g{fill:var(--gold,#a07d3c)}
.xf-ln{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1.2}
.xf-dash{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1;stroke-dasharray:4 4}
.xf-box{fill:none;stroke:var(--ink-4,#c9bfae);stroke-width:1}
.xf-hl{fill:var(--gold,#a07d3c);fill-opacity:.12}
</style>
<defs><marker id="xf-45-jianlu-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--ink-3,#9a8f80)"/></marker></defs>
<text x="350" y="30" class="xf-s" font-size="12" text-anchor="middle" >月令逢日干之禄为建禄格，月令逢劫财为月劫格；禄即是劫，二者同一格论</text><text x="86" y="76" class="xf-s" font-size="11" text-anchor="end" >日干</text><text x="86" y="124" class="xf-s" font-size="11" text-anchor="end" >禄（月令）</text><text x="120" y="80" font-size="21" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">甲</text><line x1="120" y1="90" x2="120" y2="104" class="xf-ln" marker-end="url(#xf-45-jianlu-arrow)"/><text x="120" y="128" font-size="21" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">寅</text><text x="178" y="80" font-size="21" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">乙</text><line x1="178" y1="90" x2="178" y2="104" class="xf-ln" marker-end="url(#xf-45-jianlu-arrow)"/><text x="178" y="128" font-size="21" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">卯</text><text x="236" y="80" font-size="21" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">丙</text><line x1="236" y1="90" x2="236" y2="104" class="xf-ln" marker-end="url(#xf-45-jianlu-arrow)"/><text x="236" y="128" font-size="21" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">巳</text><text x="294" y="80" font-size="21" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">丁</text><line x1="294" y1="90" x2="294" y2="104" class="xf-ln" marker-end="url(#xf-45-jianlu-arrow)"/><text x="294" y="128" font-size="21" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">午</text><text x="352" y="80" font-size="21" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">戊</text><line x1="352" y1="90" x2="352" y2="104" class="xf-ln" marker-end="url(#xf-45-jianlu-arrow)"/><text x="352" y="128" font-size="21" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">巳</text><text x="410" y="80" font-size="21" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">己</text><line x1="410" y1="90" x2="410" y2="104" class="xf-ln" marker-end="url(#xf-45-jianlu-arrow)"/><text x="410" y="128" font-size="21" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">午</text><text x="468" y="80" font-size="21" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--metal,#8a8478)">庚</text><line x1="468" y1="90" x2="468" y2="104" class="xf-ln" marker-end="url(#xf-45-jianlu-arrow)"/><text x="468" y="128" font-size="21" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--metal,#8a8478)">申</text><text x="526" y="80" font-size="21" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--metal,#8a8478)">辛</text><line x1="526" y1="90" x2="526" y2="104" class="xf-ln" marker-end="url(#xf-45-jianlu-arrow)"/><text x="526" y="128" font-size="21" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--metal,#8a8478)">酉</text><text x="584" y="80" font-size="21" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">壬</text><line x1="584" y1="90" x2="584" y2="104" class="xf-ln" marker-end="url(#xf-45-jianlu-arrow)"/><text x="584" y="128" font-size="21" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">亥</text><text x="642" y="80" font-size="21" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">癸</text><line x1="642" y1="90" x2="642" y2="104" class="xf-ln" marker-end="url(#xf-45-jianlu-arrow)"/><text x="642" y="128" font-size="21" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">子</text><text x="350" y="160" class="xf-s" font-size="11.5" text-anchor="middle" >日主与月令同气，本身不可为用，须于四柱另取财、官、煞、食为用</text>
</svg>
