<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 394" width="520" height="394" role="img" aria-label="十干的正官与七煞：同性相克为七煞，异性相克为正官">
<title>十干的正官与七煞：同性相克为七煞，异性相克为正官</title>
<style>
