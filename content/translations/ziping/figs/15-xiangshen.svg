<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" width="560" height="230" role="img" aria-label="用神与相神：官以财为相，财以官为相，煞以食为相">
<title>用神与相神：官以财为相，财以官为相，煞以食为相</title>
<style>
.xf-t{font-family:"Noto Serif SC","Songti SC",serif;fill:var(--ink,#2b2620)}
.xf-s{font-family:"Noto Sans SC","PingFang SC",sans-serif;fill:var(--ink-3,#7a7064)}
.xf-g{fill:var(--gold,#a07d3c)}
.xf-ln{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1.2}
.xf-dash{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1;stroke-dasharray:4 4}
.xf-box{fill:none;stroke:var(--ink-4,#c9bfae);stroke-width:1}
.xf-hl{fill:var(--gold,#a07d3c);fill-opacity:.12}
</style>
<defs><marker id="xf-15-xiangshen-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--ink-3,#9a8f80)"/></marker></defs>
<text x="280" y="30" class="xf-s" font-size="12" text-anchor="middle" >月令得用神，别位必有辅佐它的“相神”，如君之有相</text><rect x="70" y="50" width="110" height="36" rx="4" fill="var(--gold,#a07d3c)" fill-opacity=".12" stroke="var(--gold,#a07d3c)"/><text x="110" y="74" class="xf-g" font-size="18" text-anchor="middle" >官</text><text x="150" y="72" class="xf-s" font-size="10" text-anchor="middle" >用神</text><line x1="186" y1="68" x2="274" y2="68" class="xf-ln" marker-end="url(#xf-15-xiangshen-arrow)"/><rect x="280" y="50" width="110" height="36" rx="4" class="xf-box"/><text x="320" y="74" class="xf-t" font-size="18" text-anchor="middle" >财</text><text x="360" y="72" class="xf-s" font-size="10" text-anchor="middle" >相神</text><text x="410" y="73" class="xf-s" font-size="12" text-anchor="start" >官逢财生</text><rect x="70" y="100" width="110" height="36" rx="4" fill="var(--gold,#a07d3c)" fill-opacity=".12" stroke="var(--gold,#a07d3c)"/><text x="110" y="124" class="xf-g" font-size="18" text-anchor="middle" >财</text><text x="150" y="122" class="xf-s" font-size="10" text-anchor="middle" >用神</text><line x1="186" y1="118" x2="274" y2="118" class="xf-ln" marker-end="url(#xf-15-xiangshen-arrow)"/><rect x="280" y="100" width="110" height="36" rx="4" class="xf-box"/><text x="320" y="124" class="xf-t" font-size="18" text-anchor="middle" >官</text><text x="360" y="122" class="xf-s" font-size="10" text-anchor="middle" >相神</text><text x="410" y="123" class="xf-s" font-size="12" text-anchor="start" >财旺生官</text><rect x="70" y="150" width="110" height="36" rx="4" fill="var(--gold,#a07d3c)" fill-opacity=".12" stroke="var(--gold,#a07d3c)"/><text x="110" y="174" class="xf-g" font-size="18" text-anchor="middle" >煞</text><text x="150" y="172" class="xf-s" font-size="10" text-anchor="middle" >用神</text><line x1="186" y1="168" x2="274" y2="168" class="xf-ln" marker-end="url(#xf-15-xiangshen-arrow)"/><rect x="280" y="150" width="110" height="36" rx="4" class="xf-box"/><text x="320" y="174" class="xf-t" font-size="18" text-anchor="middle" >食</text><text x="360" y="172" class="xf-s" font-size="10" text-anchor="middle" >相神</text><text x="410" y="173" class="xf-s" font-size="12" text-anchor="start" >煞逢食制</text><text x="280" y="222" class="xf-s" font-size="11" text-anchor="middle" >全局之格赖此一字而成者，皆谓之相；伤用神甚于伤身，伤相神甚于伤用神</text>
</svg>
