<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img" aria-label="六亲的两种配法：以年月日时宫位配，以十神配">
<title>六亲的两种配法：以年月日时宫位配，以十神配</title>
<style>
.xf-t{font-family:"Noto Serif SC","Songti SC",serif;fill:var(--ink,#2b2620)}
.xf-s{font-family:"Noto Sans SC","PingFang SC",sans-serif;fill:var(--ink-3,#7a7064)}
.xf-g{fill:var(--gold,#a07d3c)}
.xf-ln{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1.2}
.xf-dash{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1;stroke-dasharray:4 4}
.xf-box{fill:none;stroke:var(--ink-4,#c9bfae);stroke-width:1}
.xf-hl{fill:var(--gold,#a07d3c);fill-opacity:.12}
</style>
<defs><marker id="xf-23-liuqin-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--ink-3,#9a8f80)"/></marker></defs>
<text x="160" y="32" class="xf-g" font-size="14" text-anchor="middle" >一、以宫位配</text><text x="470" y="32" class="xf-g" font-size="14" text-anchor="middle" >二、以十神（用神）配</text><rect x="50" y="54" width="62" height="90" rx="4" class="xf-box"/><text x="81" y="86" class="xf-t" font-size="15" text-anchor="middle" >年柱</text><text x="81" y="116" class="xf-s" font-size="11" text-anchor="middle" >祖上</text><rect x="122" y="54" width="62" height="90" rx="4" class="xf-box"/><text x="153" y="86" class="xf-t" font-size="15" text-anchor="middle" >月柱</text><text x="153" y="116" class="xf-s" font-size="11" text-anchor="middle" >父母兄弟</text><rect x="194" y="54" width="62" height="90" rx="4" class="xf-box"/><text x="225" y="86" class="xf-t" font-size="15" text-anchor="middle" >日柱</text><text x="225" y="116" class="xf-s" font-size="11" text-anchor="middle" >妻</text><rect x="266" y="54" width="62" height="90" rx="4" class="xf-box"/><text x="297" y="86" class="xf-t" font-size="15" text-anchor="middle" >时柱</text><text x="297" y="116" class="xf-s" font-size="11" text-anchor="middle" >子女</text><line x1="50" y1="166" x2="330" y2="166" class="xf-ln" marker-end="url(#xf-23-liuqin-arrow)"/><text x="190" y="186" class="xf-s" font-size="11" text-anchor="middle" >自上而下：祖、父、妻、子</text><text x="390" y="66" class="xf-t" font-size="14" text-anchor="middle" >正印</text><text x="430" y="66" class="xf-s" font-size="12" text-anchor="middle" >→</text><text x="470" y="66" class="xf-g" font-size="14" text-anchor="middle" >母</text><text x="512" y="66" class="xf-s" font-size="11" text-anchor="start" >生我者</text><text x="390" y="100" class="xf-t" font-size="14" text-anchor="middle" >偏财</text><text x="430" y="100" class="xf-s" font-size="12" text-anchor="middle" >→</text><text x="470" y="100" class="xf-g" font-size="14" text-anchor="middle" >父</text><text x="512" y="100" class="xf-s" font-size="11" text-anchor="start" >母之正夫</text><text x="390" y="134" class="xf-t" font-size="14" text-anchor="middle" >正财</text><text x="430" y="134" class="xf-s" font-size="12" text-anchor="middle" >→</text><text x="470" y="134" class="xf-g" font-size="14" text-anchor="middle" >妻</text><text x="512" y="134" class="xf-s" font-size="11" text-anchor="start" >我所克制</text><text x="390" y="168" class="xf-t" font-size="14" text-anchor="middle" >官煞</text><text x="430" y="168" class="xf-s" font-size="12" text-anchor="middle" >→</text><text x="470" y="168" class="xf-g" font-size="14" text-anchor="middle" >子女</text><text x="512" y="168" class="xf-s" font-size="11" text-anchor="start" >财（妻）所生</text><text x="390" y="202" class="xf-t" font-size="14" text-anchor="middle" >比肩</text><text x="430" y="202" class="xf-s" font-size="12" text-anchor="middle" >→</text><text x="470" y="202" class="xf-g" font-size="14" text-anchor="middle" >兄弟</text><text x="512" y="202" class="xf-s" font-size="11" text-anchor="start" >与我同类</text><text x="320" y="270" class="xf-s" font-size="11.5" text-anchor="middle" >再看四柱中各宫所坐、各星所透的喜忌，参而配之，六亲得力与否即可了然</text>
</svg>
