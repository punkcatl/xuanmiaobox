<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" role="img" aria-label="生克先后分吉凶：四柱由年至时如人生由早至晚">
<title>生克先后分吉凶：四柱由年至时如人生由早至晚</title>
<style>
.xf-t{font-family:"Noto Serif SC","Songti SC",serif;fill:var(--ink,#2b2620)}
.xf-s{font-family:"Noto Sans SC","PingFang SC",sans-serif;fill:var(--ink-3,#7a7064)}
.xf-g{fill:var(--gold,#a07d3c)}
.xf-ln{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1.2}
.xf-dash{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1;stroke-dasharray:4 4}
.xf-box{fill:none;stroke:var(--ink-4,#c9bfae);stroke-width:1}
.xf-hl{fill:var(--gold,#a07d3c);fill-opacity:.12}
</style>
<defs><marker id="xf-20-xianhou-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--ink-3,#9a8f80)"/></marker></defs>
<text x="140" y="36" class="xf-s" font-size="12" text-anchor="middle" >年柱</text><text x="140" y="54" class="xf-s" font-size="10.5" text-anchor="middle" >早年</text><text x="260" y="36" class="xf-s" font-size="12" text-anchor="middle" >月柱</text><text x="260" y="54" class="xf-s" font-size="10.5" text-anchor="middle" >青年</text><text x="380" y="36" class="xf-s" font-size="12" text-anchor="middle" >日柱</text><text x="380" y="54" class="xf-s" font-size="10.5" text-anchor="middle" >中年</text><text x="500" y="36" class="xf-s" font-size="12" text-anchor="middle" >时柱</text><text x="500" y="54" class="xf-s" font-size="10.5" text-anchor="middle" >晚年</text><line x1="100" y1="64" x2="560" y2="64" class="xf-ln" marker-end="url(#xf-20-xianhou-arrow)"/><text x="580" y="68" class="xf-s" font-size="11" text-anchor="start" >先 → 后</text><text x="60" y="90" class="xf-g" font-size="15" text-anchor="middle" >吉</text><text x="60" y="112" class="xf-s" font-size="11" text-anchor="middle" >丁先戊后</text><text x="60" y="178" class="xf-t" font-size="15" text-anchor="middle" >凶</text><text x="60" y="200" class="xf-s" font-size="11" text-anchor="middle" >戊先丁后</text><text x="140" y="108" font-size="20" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">丁</text><text x="140" y="128" class="xf-s" font-size="10.5" text-anchor="middle" >伤官先见</text><text x="260" y="108" font-size="20" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">戊</text><text x="260" y="128" class="xf-s" font-size="10.5" text-anchor="middle" >财来解伤</text><text x="380" y="108" class="xf-t" font-size="20" text-anchor="middle" >甲</text><text x="380" y="128" class="xf-s" font-size="10.5" text-anchor="middle" >日主</text><text x="500" y="112" class="xf-g" font-size="12" text-anchor="middle" >后运有结局</text><text x="140" y="196" font-size="20" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">戊</text><text x="140" y="216" class="xf-s" font-size="10.5" text-anchor="middle" >官遇财生</text><text x="260" y="196" font-size="20" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">丁</text><text x="260" y="216" class="xf-s" font-size="10.5" text-anchor="middle" >后因伤破</text><text x="380" y="196" class="xf-t" font-size="20" text-anchor="middle" >甲</text><text x="380" y="216" class="xf-s" font-size="10.5" text-anchor="middle" >日主</text><text x="500" y="200" class="xf-s" font-size="12" text-anchor="middle" >终无结局</text><text x="320" y="260" class="xf-s" font-size="11.5" text-anchor="middle" >甲用酉中辛金为正官：同是财（戊）、伤（丁）并透，先后不同而吉凶迥异</text>
</svg>
