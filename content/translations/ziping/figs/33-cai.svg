f6d85)">子</text><text x="496" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >癸·正财</text><rect x="477" y="120" width="38" height="32" rx="3" fill="none" stroke="var(--gold,#a07d3c)" stroke-width="1.6"/><text x="518" y="132" font-size="11" class="xf-g">财</text><text x="570" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >日柱</text><text x="570" y="72" class="xf-g" font-size="11" text-anchor="middle" >日元</text><text x="570" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">戊</text><text x="570" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">寅</text><text x="570" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >甲·七煞</text><text x="644" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >时柱</text><text x="644" y="72" class="xf-s" font-size="11" text-anchor="middle" >七煞</text><text x="644" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">甲</text><text x="644" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">寅</text><text x="644" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >甲·七煞</text><rect x="625" y="80" width="38" height="32" rx="3" fill="none" stroke="var(--gold,#a07d3c)" stroke-width="1.6"/><text x="666" y="92" font-size="11" class="xf-g">煞</text><text x="517" y="196" class="xf-s" font-size="11.5" text-anchor="middle" >子水为财，甲寅七煞，</text><text x="517" y="214" class="xf-s" font-size="11.5" text-anchor="middle" >庚金食神制煞生财</text>
