<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-label="根与比肩的轻重：天干比肩多，不如地支有根">
<title>根与比肩的轻重：天干比肩多，不如地支有根</title>
<style>
.xf-t{font-family:"Noto Serif SC","Songti SC",serif;fill:var(--ink,#2b2620)}
.xf-s{font-family:"Noto Sans SC","PingFang SC",sans-serif;fill:var(--ink-3,#7a7064)}
.xf-g{fill:var(--gold,#a07d3c)}
.xf-ln{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1.2}
.xf-dash{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1;stroke-dasharray:4 4}
.xf-box{fill:none;stroke:var(--ink-4,#c9bfae);stroke-width:1}
.xf-hl{fill:var(--gold,#a07d3c);fill-opacity:.12}
</style>
<defs><marker id="xf-06-gen-bijian-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--ink-3,#9a8f80)"/></marker></defs>
<rect x="30" y="18" width="190" height="34" rx="3" class="xf-box"/><text x="125" y="40" class="xf-t" font-size="15" text-anchor="middle" >天干一比肩</text><text x="255" y="40" class="xf-s" font-size="12" text-anchor="middle" >不如</text><rect x="290" y="18" width="170" height="34" rx="3" fill="var(--gold,#a07d3c)" fill-opacity=".1" stroke="var(--gold,#a07d3c)" stroke-width="1"/><text x="375" y="40" class="xf-g" font-size="15" text-anchor="middle" >地支一墓库</text><text x="472" y="40" class="xf-s" font-size="11" text-anchor="start" >如甲逢未、丙逢戌</text><rect x="30" y="70" width="190" height="34" rx="3" class="xf-box"/><text x="125" y="92" class="xf-t" font-size="15" text-anchor="middle" >天干两比肩</text><text x="255" y="92" class="xf-s" font-size="12" text-anchor="middle" >不如</text><rect x="290" y="70" width="170" height="34" rx="3" fill="var(--gold,#a07d3c)" fill-opacity=".1" stroke="var(--gold,#a07d3c)" stroke-width="1"/><text x="375" y="92" class="xf-g" font-size="15" text-anchor="middle" >地支一余气</text><text x="472" y="92" class="xf-s" font-size="11" text-anchor="start" >如乙逢辰、丁逢未</text><rect x="30" y="122" width="190" height="34" rx="3" class="xf-box"/><text x="125" y="144" class="xf-t" font-size="15" text-anchor="middle" >天干三比肩</text><text x="255" y="144" class="xf-s" font-size="12" text-anchor="middle" >不如</text><rect x="290" y="122" width="170" height="34" rx="3" fill="var(--gold,#a07d3c)" fill-opacity=".1" stroke="var(--gold,#a07d3c)" stroke-width="1"/><text x="375" y="144" class="xf-g" font-size="15" text-anchor="middle" >一长生禄刃</text><text x="472" y="144" class="xf-s" font-size="11" text-anchor="start" >如甲逢亥、寅、卯</text><text x="300" y="190" class="xf-s" font-size="12" text-anchor="middle" >比劫如朋友相扶，通根如有家可住；天干多不如地支根重</text>
</svg>
