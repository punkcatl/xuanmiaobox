<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 732 250" width="732" height="250" role="img" aria-label="伤官格命例：孛罗平章命、罗状元命">
<title>伤官格命例：孛罗平章命、罗状元命</title>
<style>
.xf-t{font-family:"Noto Serif SC","Songti SC",serif;fill:var(--ink,#2b2620)}
.xf-s{font-family:"Noto Sans SC","PingFang SC",sans-serif;fill:var(--ink-3,#7a7064)}
.xf-g{fill:var(--gold,#a07d3c)}
.xf-ln{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1.2}
.xf-dash{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1;stroke-dasharray:4 4}
.xf-box{fill:none;stroke:var(--ink-4,#c9bfae);stroke-width:1}
.xf-hl{fill:var(--gold,#a07d3c);fill-opacity:.12}
</style>
<defs><marker id="xf-41-shangguan-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--ink-3,#9a8f80)"/></marker></defs>
<text x="161" y="26" class="xf-t" font-size="14" text-anchor="middle" >孛罗平章命</text><text x="66" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >年柱</text><text x="66" y="72" class="xf-s" font-size="11" text-anchor="middle" >偏印</text><text x="66" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">壬</text><text x="66" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--metal,#8a8478)">申</text><text x="66" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >庚·七煞</text><rect x="47" y="80" width="38" height="32" rx="3" fill="none" stroke="var(--gold,#a07d3c)" stroke-width="1.6"/><text x="88" y="92" font-size="11" class="xf-g">印</text><text x="140" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >月柱</text><text x="140" y="72" class="xf-s" font-size="11" text-anchor="middle" >食神</text><text x="140" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">丙</text><text x="140" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">午</text><text x="140" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >丁·伤官</text><rect x="121" y="120" width="38" height="32" rx="3" fill="none" stroke="var(--gold,#a07d3c)" stroke-width="1.6"/><text x="162" y="132" font-size="11" class="xf-g">伤</text><text x="214" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >日柱</text><text x="214" y="72" class="xf-g" font-size="11" text-anchor="middle" >日元</text><text x="214" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">甲</text><text x="214" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">午</text><text x="214" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >丁·伤官</text><text x="288" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >时柱</text><text x="288" y="72" class="xf-s" font-size="11" text-anchor="middle" >偏印</text><text x="288" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">壬</text><text x="288" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--metal,#8a8478)">申</text><text x="288" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >庚·七煞</text><rect x="269" y="80" width="38" height="32" rx="3" fill="none" stroke="var(--gold,#a07d3c)" stroke-width="1.6"/><text x="310" y="92" font-size="11" class="xf-g">印</text><text x="161" y="196" class="xf-s" font-size="11.5" text-anchor="middle" >午中丁火伤官旺，壬水印根深，身又弱；</text><text x="161" y="214" class="xf-s" font-size="11.5" text-anchor="middle" >夏木逢润，伤官佩印，一品之贵</text><text x="517" y="26" class="xf-t" font-size="14" text-anchor="middle" >罗状元命</text><text x="422" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >年柱</text><text x="422" y="72" class="xf-s" font-size="11" text-anchor="middle" >正财</text><text x="422" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">甲</text><text x="422" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">子</text><text x="422" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >癸·食神</text><rect x="403" y="80" width="38" height="32" rx="3" fill="none" stroke="var(--gold,#a07d3c)" stroke-width="1.6"/><text x="444" y="92" font-size="11" class="xf-g">财</text><text x="496" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >月柱</text><text x="496" y="72" class="xf-s" font-size="11" text-anchor="middle" >偏财</text><text x="496" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">乙</text><text x="496" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">亥</text><text x="496" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >壬·伤官</text><rect x="477" y="120" width="38" height="32" rx="3" fill="none" stroke="var(--gold,#a07d3c)" stroke-width="1.6"/><text x="518" y="132" font-size="11" class="xf-g">伤</text><text x="570" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >日柱</text><text x="570" y="72" class="xf-g" font-size="11" text-anchor="middle" >日元</text><text x="570" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--metal,#8a8478)">辛</text><text x="570" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">未</text><text x="570" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >己·偏印</text><text x="644" y="50" class="xf-s" font-size="10.5" text-anchor="middle" >时柱</text><text x="644" y="72" class="xf-s" font-size="11" text-anchor="middle" >正印</text><text x="644" y="104" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--earth,#9a7b45)">戊</text><text x="644" y="144" font-size="26" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">子</text><text x="644" y="166" class="xf-s" font-size="10.5" text-anchor="middle" >癸·食神</text><text x="517" y="196" class="xf-s" font-size="11.5" text-anchor="middle" >亥中壬水为伤官，亥未会木，</text><text x="517" y="214" class="xf-s" font-size="11.5" text-anchor="middle" >化伤为财（甲透通根于亥），大为秀气</text>
</svg>
