<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img" aria-label="辰戌丑未四库土所藏">
<title>辰戌丑未四库土所藏</title>
<style>
.xf-t{font-family:"Noto Serif SC","Songti SC",serif;fill:var(--ink,#2b2620)}
.xf-s{font-family:"Noto Sans SC","PingFang SC",sans-serif;fill:var(--ink-3,#7a7064)}
.xf-g{fill:var(--gold,#a07d3c)}
.xf-ln{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1.2}
.xf-dash{stroke:var(--ink-3,#9a8f80);fill:none;stroke-width:1;stroke-dasharray:4 4}
.xf-box{fill:none;stroke:var(--ink-4,#c9bfae);stroke-width:1}
.xf-hl{fill:var(--gold,#a07d3c);fill-opacity:.12}
</style>
<defs><marker id="xf-qiongtong-04-siku-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9z" fill="var(--ink-3,#9a8f80)"/></marker></defs>
<rect x="30" y="48" width="280" height="168" class="xf-hl"/><text x="170" y="36" class="xf-g" font-size="13" text-anchor="middle" >辰未：滋养万物，春夏为功（聚之为贵）</text><text x="470" y="36" class="xf-s" font-size="13" text-anchor="middle" >戌丑：秋火冬金，肃杀万物（聚之不贵）</text><rect x="44" y="60" width="112" height="144" rx="6" class="xf-box"/><text x="100" y="80" class="xf-s" font-size="12" text-anchor="middle" >春末</text><text x="100" y="124" font-size="34" text-anchor="middle" font-family="Noto Serif SC,serif" font-weight="600" style="fill:var(--earth,#9a7b45)">辰</text><text x="100" y="154" class="xf-t" font-size="15" text-anchor="middle" >伏水</text><text x="100" y="186" font-size="16" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--water,#4f6d85)">癸水</text><rect x="191" y="60" width="112" height="144" rx="6" class="xf-box"/><text x="247" y="80" class="xf-s" font-size="12" text-anchor="middle" >夏末</text><text x="247" y="124" font-size="34" text-anchor="middle" font-family="Noto Serif SC,serif" font-weight="600" style="fill:var(--earth,#9a7b45)">未</text><text x="247" y="154" class="xf-t" font-size="15" text-anchor="middle" >匿木</text><text x="247" y="186" font-size="16" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--wood,#5f7d55)">乙木</text><rect x="338" y="60" width="112" height="144" rx="6" class="xf-box"/><text x="394" y="80" class="xf-s" font-size="12" text-anchor="middle" >秋末</text><text x="394" y="124" font-size="34" text-anchor="middle" font-family="Noto Serif SC,serif" font-weight="600" style="fill:var(--earth,#9a7b45)">戌</text><text x="394" y="154" class="xf-t" font-size="15" text-anchor="middle" >藏火</text><text x="394" y="186" font-size="16" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--fire,#b5533f)">丁火</text><rect x="485" y="60" width="112" height="144" rx="6" class="xf-box"/><text x="541" y="80" class="xf-s" font-size="12" text-anchor="middle" >冬末</text><text x="541" y="124" font-size="34" text-anchor="middle" font-family="Noto Serif SC,serif" font-weight="600" style="fill:var(--earth,#9a7b45)">丑</text><text x="541" y="154" class="xf-t" font-size="15" text-anchor="middle" >隐金</text><text x="541" y="186" font-size="16" text-anchor="middle" font-family="Noto Serif SC,serif" style="fill:var(--metal,#8a8478)">辛金</text><text x="320" y="246" class="xf-s" font-size="12" text-anchor="middle" >四季之土各藏一气：辰藏癸水，未藏乙木，戌藏丁火，丑藏辛金</text><text x="320" y="270" class="xf-s" font-size="11" text-anchor="middle" >据本章“辰有伏水，未有匿木……戌有藏火，丑有隐金”整理</text>
</svg>
